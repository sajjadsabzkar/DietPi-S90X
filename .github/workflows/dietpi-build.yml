name: DietPi-Build
on:
  workflow_dispatch:
    inputs:
      buildargs:
        description: 'DietPi-Build arguments'
        required: true
      testkernel:
        description: 'Install test kernel'
        type: boolean
        default: false
      testuboot:
        description: 'Install test U-Boot'
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.buildargs }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write # upload/download build artifacts
jobs:
  prep:
    outputs:
      buildargs: ${{ steps.buildargs.outputs.buildargs }}
    runs-on: ubuntu-24.04
    steps:
    - id: buildargs
      run: |
        if [ '${{ github.event.inputs.buildargs }}' = 'tvbox' ]
        then
          echo buildargs=[\
        '"-m 110 -d 7", "-m 110 -d 8", "-m 110 -d 9"]' >> "$GITHUB_OUTPUT"
        elif [ '${{ github.event.inputs.buildargs }}' = 'sbcs' ]
        then
          echo buildargs=[\
        '"-m 12 -d 7", "-m 12 -d 8", "-m 12 -d 9",'\
        '"-m 15 -d 7", "-m 15 -d 8", "-m 15 -d 9",'\
        '"-m 16 -d 7", "-m 16 -d 8", "-m 16 -d 9",'\
        '"-m 17 -d 7", "-m 17 -d 8", "-m 17 -d 9",'\
        '"-m 54 -d 7", "-m 54 -d 8", "-m 54 -d 9",'\
        '"-m 74 -d 7", "-m 74 -d 8", "-m 74 -d 9",'\
        '"-m 109 -d 7", "-m 109 -d 8", "-m 109 -d 9",'\
        '"-m 110 -d 7", "-m 110 -d 8", "-m 110 -d 9"]' >> "$GITHUB_OUTPUT"
        else
          echo buildargs='["${{ github.event.inputs.buildargs }}"]' >> "$GITHUB_OUTPUT"
        fi
  build:
    needs: prep
    strategy:
      matrix:
        buildargs: ${{ fromJson(needs.prep.outputs.buildargs) }}
      fail-fast: false
    name: "Build: ${{ matrix.buildargs }}"
    runs-on: 'ubuntu-24.04-arm'
    steps:
    - name: Run DietPi-Build
      run: |
        sudo systemctl --now mask ssh ssh.socket systemd-resolved azure-proxy-agent
        echo 'nameserver 1.1.1.1' | sudo tee /etc/resolv.conf > /dev/null
        buildargs='${{ matrix.buildargs }}'
        [ '${{ github.event.inputs.testkernel }}' == 'true' ] && buildargs="$buildargs --test-kernel"
        [ '${{ github.event.inputs.testuboot }}' == 'true' ] && buildargs="$buildargs --test-uboot"
        sudo bash -c "G_GITOWNER=$GITHUB_REPOSITORY_OWNER G_GITBRANCH=$GITHUB_REF_NAME GITREPO=${GITHUB_REPOSITORY#*/}; $(curl -sSf "https://raw.githubusercontent.com/$GITHUB_REPOSITORY_OWNER/${GITHUB_REPOSITORY#*/}/$GITHUB_REF_NAME/.build/images/dietpi-build" || echo false)" -- $buildargs -o "$GITHUB_REPOSITORY_OWNER" -b "$GITHUB_REF_NAME"
    - name: Upload DietPi images
      uses: actions/upload-artifact@v4
      with:
        name: tvbox-images-${{ strategy.job-index }}
        path: |
          DietPi_TVBoxS90X*.img.xz
          DietPi_TVBoxS90X*.img.xz.sha256
        if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read # download build artifacts
      contents: write # publish GitHub release
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: assets
        merge-multiple: true
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        shopt -s nullglob
        files=( assets/* )
        [[ -n ${files[0]} ]] || { echo '::error::No image assets found'; exit 1; }
        gh release create "tvbox-s90x-${{ github.run_id }}" "${files[@]}" --title 'DietPi TVBox S90X (fork test build)' --notes "Built from $GITHUB_REF_NAME via the 'tvbox' preset" -R "$GITHUB_REPOSITORY"